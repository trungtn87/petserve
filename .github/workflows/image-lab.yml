name: Image Lab contracts + Android APK
on:
  push:
    branches: [test/ai-image-gene-stages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.6.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_VERSION="4.6.1"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Prepare Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Import and check scripts
        run: |
          godot --headless --editor --path . --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then exit 1; fi

      - name: Deterministic morphology and Gene catalog
        run: timeout 90 godot --headless --path . --script tools/image_lab/test_lineage_morphology.gd

      - name: All seven elements through Final and UI
        run: timeout 90 godot --headless --path . --script tools/image_lab/test_image_lab.gd

      - name: Random PetHome identity and Gene stages 1-4
        run: timeout 90 godot --headless --path . --script tools/image_lab/test_random_four_stage.gd

      - name: Resolved shape and A/B preset
        run: timeout 90 godot --headless --path . --script tools/image_lab/test_resolved_form.gd

      - name: Startup
        run: |
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/startup.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/startup.log; then exit 1; fi

      - name: Export Android debug APK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euxo pipefail
          mkdir -p builds
          godot --headless --path . --export-debug "com.PetVerse.game" builds/PetVerse_ImageLab_random_stage1_4.apk
          test -s builds/PetVerse_ImageLab_random_stage1_4.apk
          ls -lh builds/PetVerse_ImageLab_random_stage1_4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PetVerse-ImageLab-random-stage1-4-apk
          path: builds/PetVerse_ImageLab_random_stage1_4.apk
          if-no-files-found: error
          retention-days: 14
