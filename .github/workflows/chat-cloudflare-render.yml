name: Chat Cloudflare render test

on:
  push:
    branches:
      - test/chat-cloudflare-render-20261002

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import project
        run: |
          godot --headless --editor --path . --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then exit 1; fi

      - name: Build current pethome prompt
        run: |
          godot --headless --path . --script tools/image_lab/chat_cloudflare_render.gd

      - name: Call deployed Cloudflare Worker
        run: |
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/petverse_render_request.json \
            https://petverse-render-proxy.trungtn87.workers.dev/v1/render/initial \
            -o /tmp/cloudflare_response.json

          jq -e '.ok == true and (.image | type == "string") and (.image | length > 100)' \
            /tmp/cloudflare_response.json >/dev/null

          jq -r '.image' /tmp/cloudflare_response.json | base64 --decode > /tmp/cloudflare_pet.png
          jq 'del(.image)' /tmp/cloudflare_response.json > /tmp/cloudflare_metadata.json
          file /tmp/cloudflare_pet.png

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pet-render
          path: |
            /tmp/cloudflare_pet.png
            /tmp/cloudflare_metadata.json
            /tmp/petverse_prompt.txt
          if-no-files-found: error
          retention-days: 1
