name: Pethome Android Test Build

on:
  push:
    branches:
      - pethome
  pull_request:
    branches:
      - pethome
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pethome
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.6.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_VERSION="4.6.1"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          godot --version

      - name: Build Bluetooth plugin and install Android source template
        run: python3 tools/build_bluetooth_plugin.py --configure-export --templates "$HOME/.local/share/godot/export_templates/4.6.1.stable"

      - name: Prepare Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Parse project
        shell: bash
        run: |
          godot --headless --editor --path . --quit

      - name: Exact source prompt assembly and transport for twelve species
        run: timeout 90 godot --headless --path . --script tools/test_source_prompt_contract.gd

      - name: Test twelve species morphology from 47d8688
        run: timeout 120 godot --headless --path . --script tools/test_species_morphology.gd

      - name: Test initial render contract
        shell: bash
        run: |
          export XDG_DATA_HOME=/tmp/petverse-test-initial
          godot --headless --path . --script tools/test_initial_render_contract.gd

      - name: Test Stage 1 to Stage 2 evolution policy
        shell: bash
        run: |
          export XDG_DATA_HOME=/tmp/petverse-test-m9
          godot --headless --path . --script tools/test_m9_stage1_evolution_service.gd

      - name: Test Stage 3 and Stage 4 lifecycle
        shell: bash
        run: |
          export XDG_DATA_HOME=/tmp/petverse-test-m8
          godot --headless --path . tools/test_m8_stage_cycle.tscn

      - name: Test Legacy item inheritance
        shell: bash
        run: |
          export XDG_DATA_HOME=/tmp/petverse-test-legacy
          godot --headless --path . tools/test_legacy_item_inheritance.tscn

      - name: Test independent element crystallization slots
        shell: bash
        run: |
          export XDG_DATA_HOME=/tmp/petverse-test-crystallization
          godot --headless --path . tools/test_element_crystallization.tscn

      - name: Tetris endless gameplay, rewards, leaderboard and mobile UI
        run: timeout 90 godot --headless --path . res://tools/test_tetris.tscn

      - name: Tank maps, gameplay, rewards and real two-player sync
        run: timeout 90 godot --headless --path . res://tools/test_tank.tscn

      - name: Test local two-player connection
        run: timeout 60 godot --headless --path . res://tools/test_local_connection.tscn

      - name: Export Android debug APK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euxo pipefail
          mkdir -p builds
          godot --headless --path . --export-debug "com.PetVerse.game" builds/PetVerse_pethome_test.apk
          test -s builds/PetVerse_pethome_test.apk
          ls -lh builds/PetVerse_pethome_test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PetVerse-pethome-test-apk
          path: builds/PetVerse_pethome_test.apk
          if-no-files-found: error
          retention-days: 14
