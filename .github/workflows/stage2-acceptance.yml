name: Stage 2 Acceptance + Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - pethome
      - "feat/stage2-*"

permissions:
  contents: read

concurrency:
  group: stage2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-acceptance:
    name: Godot 4.6.3 headless acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Stage 2 lifecycle
        run: godot --headless --path . res://tools/test_m8_stage_cycle.tscn

      - name: Stage 2 reward contract
        run: godot --headless --path . res://tools/test_stage2_rewards.tscn

      - name: Stage 2 Gene resolver
        run: godot --headless --path . res://tools/test_m9_stage_evolution_resolver.tscn

      - name: Stage 2 Mythic contract
        run: godot --headless --path . res://tools/test_stage2_mythic_mutation.tscn

      - name: Stage 2 Mythic retry plan
        run: godot --headless --path . res://tools/test_stage2_mythic_evolution_plan.tscn

      - name: Stage 2 PetHome feedback
        run: godot --headless --path . res://tools/test_stage2_pethome_feedback.tscn

      - name: Stage 2 to Stage 3 acceptance
        run: godot --headless --path . res://tools/test_stage2_to_stage3_acceptance.tscn

  android-debug-apk:
    name: Android debug APK smoke build
    needs: godot-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb --version
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version

      - name: Export Android debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: builds
          presets_to_export: com.PetVerse.game
          export_debug: true
          cache: true
          verbose: true

      - name: List APK output
        run: |
          echo "Build directory: ${{ steps.export.outputs.build_directory }}"
          find "${{ steps.export.outputs.build_directory }}" -maxdepth 3 -type f -print

      - name: Upload Android smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: PetVerse-Stage2-Android-debug
          path: ${{ steps.export.outputs.build_directory }}
          if-no-files-found: error
          retention-days: 14
